<title>The Goldsmith</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Макет: одна горизонтальная лента во весь экран, кадр за кадром, с привязкой прокрутки */
:root{
  --bg:#0A0A0C;
  --fg:#ECECEF;
  --dot:rgba(236,236,239,.30);
  --dot-on:#D9B45B;
  --chrome:rgba(12,12,14,.55);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);overflow:hidden;font-family:-apple-system,"Segoe UI",system-ui,sans-serif}

.rail{
  height:100%;display:flex;
  overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;overscroll-behavior-x:contain;
}
.rail::-webkit-scrollbar{display:none}

.slide{
  flex:0 0 100%;min-width:0;height:100%;
  scroll-snap-align:center;scroll-snap-stop:always;
  display:grid;place-items:center;
  padding:max(8px,env(safe-area-inset-left,0px)) max(8px,env(safe-area-inset-right,0px));
}
.slide img{
  max-width:100%;max-height:100%;width:auto;height:auto;
  object-fit:contain;display:block;
  transition:transform .35s ease;transform-origin:center center;
  cursor:zoom-in;
}
.slide img.zoom{transform:scale(1.9);cursor:zoom-out}

/* Стрелки — только там, где есть курсор */
.nav{
  position:fixed;top:50%;transform:translateY(-50%);z-index:3;
  width:46px;height:46px;border:none;border-radius:50%;
  background:var(--chrome);color:var(--fg);
  display:none;place-items:center;cursor:pointer;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.nav:hover{background:rgba(12,12,14,.8)}
.nav.prev{left:calc(14px + env(safe-area-inset-left,0px))}
.nav.next{right:calc(14px + env(safe-area-inset-right,0px))}
@media (hover:hover) and (pointer:fine){.nav{display:grid}}

/* Точки */
.dots{
  position:fixed;left:0;right:0;z-index:3;
  bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;justify-content:center;align-items:center;gap:9px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  flex-wrap:wrap;pointer-events:none;
}
.dots button{
  pointer-events:auto;
  width:7px;height:7px;padding:0;border:none;border-radius:50%;
  background:var(--dot);cursor:pointer;transition:background .25s,transform .25s;
}
.dots button[aria-current="true"]{background:var(--dot-on);transform:scale(1.5)}

:focus-visible{outline:2px solid var(--dot-on);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.rail{scroll-behavior:auto}.slide img{transition:none}}
</style>

<div class="rail" id="rail" tabindex="0" aria-label="Фотографии изделий"></div>

<button class="nav prev" id="prev" type="button" aria-label="Предыдущий кадр">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
</button>
<button class="nav next" id="next" type="button" aria-label="Следующий кадр">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
</button>

<div class="dots" id="dots"></div>

<script>
/* Порядок кадров: имена файлов в img/ */
const SHOTS = [
  "noir","smaragd","aquavela","rubis","amethyste","eclat","soleil",
  "rubelle","violetta","olivine","malachite","azur","lazuli"
];

const rail=document.getElementById("rail");
const dots=document.getElementById("dots");
let index=0;

SHOTS.forEach((slug,i)=>{
  const fig=document.createElement("div");
  fig.className="slide";
  const img=document.createElement("img");
  img.src=`img/${slug}-look.webp`;
  img.alt="";
  img.decoding="async";
  img.loading=i<2?"eager":"lazy";
  img.addEventListener("click",()=>img.classList.toggle("zoom"));
  fig.append(img);
  rail.append(fig);

  const d=document.createElement("button");
  d.type="button";
  d.setAttribute("aria-label",`Кадр ${i+1} из ${SHOTS.length}`);
  d.setAttribute("aria-current",i===0?"true":"false");
  d.addEventListener("click",()=>go(i));
  dots.append(d);
});

const slides=[...rail.children];
const buttons=[...dots.children];

function go(i){
  index=Math.max(0,Math.min(SHOTS.length-1,i));
  rail.scrollTo({left:slides[index].offsetLeft,behavior:"smooth"});
  mark();
}
function mark(){
  buttons.forEach((b,i)=>b.setAttribute("aria-current",i===index?"true":"false"));
}

/* Какой кадр по центру — считаем от прокрутки, чтобы свайп тоже двигал точки */
let raf=null;
rail.addEventListener("scroll",()=>{
  if(raf)return;
  raf=requestAnimationFrame(()=>{
    raf=null;
    const i=Math.round(rail.scrollLeft/rail.clientWidth);
    if(i!==index && i>=0 && i<SHOTS.length){
      index=i;
      slides.forEach(s=>s.querySelector("img").classList.remove("zoom"));
      mark();
    }
  });
});

document.getElementById("prev").addEventListener("click",()=>go(index-1));
document.getElementById("next").addEventListener("click",()=>go(index+1));
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key==="PageDown"){go(index+1);e.preventDefault()}
  if(e.key==="ArrowLeft"||e.key==="PageUp"){go(index-1);e.preventDefault()}
  if(e.key==="Home"){go(0);e.preventDefault()}
  if(e.key==="End"){go(SHOTS.length-1);e.preventDefault()}
});

/* Колесо мыши листает по горизонтали */
rail.addEventListener("wheel",e=>{
  if(Math.abs(e.deltaY)<=Math.abs(e.deltaX))return;
  e.preventDefault();
  go(index+(e.deltaY>0?1:-1));
},{passive:false});
</script>
