<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Goldsmith — съёмки</title>
<style>
/* Макет: одна горизонтальная лента во весь экран, кадр за кадром, с привязкой прокрутки */
:root{
  --bg:#0A0A0C;
  --fg:#ECECEF;
  --dot:rgba(236,236,239,.30);
  --dot-on:#D9B45B;
  --chrome:rgba(12,12,14,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font-family:-apple-system,"Segoe UI",system-ui,sans-serif}
img{max-width:100%}

/* Фоновая съёмка во весь экран, поверх — вуаль, чтобы кадры не спорили с ней */
.backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;background:url("img/backdrop.webp") center center/cover no-repeat;filter:brightness(.38) saturate(.85)}
.backdrop::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(10,10,12,.35) 0%,rgba(10,10,12,.78) 100%)}

.rail{
  position:relative;z-index:1;
  /* абсолютная высота, а не проценты: в iframe цепочка html→body→rail рвётся */
  height:100vh;height:100dvh;
  display:flex;
  overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;overscroll-behavior-x:contain;
}
.rail::-webkit-scrollbar{display:none}

.slide{
  flex:0 0 100%;min-width:0;height:100%;
  scroll-snap-align:center;scroll-snap-stop:always;
  display:grid;place-items:center;
  padding:max(8px,env(safe-area-inset-left,0px)) max(8px,env(safe-area-inset-right,0px));
}
.slide img{
  max-width:100%;max-height:100%;min-width:0;min-height:0;width:auto;height:auto;
  object-fit:contain;display:block;
  box-shadow:0 20px 64px rgba(0,0,0,.6);
  transition:transform .35s ease;transform-origin:center center;
  cursor:zoom-in;
}
.slide img.zoom{transform:scale(1.9);cursor:zoom-out}

/* Стрелки — только там, где есть курсор */
.nav{
  position:fixed;top:50%;transform:translateY(-50%);z-index:3;
  width:46px;height:46px;border:none;border-radius:50%;
  background:var(--chrome);color:var(--fg);
  display:none;place-items:center;cursor:pointer;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.nav:hover{background:rgba(12,12,14,.8)}
.nav.prev{left:calc(14px + env(safe-area-inset-left,0px))}
.nav.next{right:calc(14px + env(safe-area-inset-right,0px))}
@media (hover:hover) and (pointer:fine){.nav{display:grid}}

/* Точки */
.dots{
  position:fixed;left:0;right:0;z-index:3;
  bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;justify-content:center;align-items:center;gap:9px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  flex-wrap:wrap;pointer-events:none;
}
.dots button{
  pointer-events:auto;
  width:7px;height:7px;padding:0;border:none;border-radius:50%;
  background:var(--dot);cursor:pointer;transition:background .25s,transform .25s;
}
.dots button[aria-current="true"]{background:var(--dot-on);transform:scale(1.5)}

.back{
  position:fixed;z-index:4;
  top:calc(14px + env(safe-area-inset-top,0px));
  left:calc(14px + env(safe-area-inset-left,0px));
  width:42px;height:42px;border-radius:50%;
  background:var(--chrome);color:var(--fg);
  display:grid;place-items:center;text-decoration:none;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.back:hover{background:rgba(12,12,14,.85)}
:focus-visible{outline:2px solid var(--dot-on);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.rail{scroll-behavior:auto}.slide img{transition:none}}
</style>
</head>
<body>

<div class="backdrop" aria-hidden="true"></div>

<a class="back" href="index.html" aria-label="Вернуться на сайт">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
</a>

<div class="rail" id="rail" tabindex="0" aria-label="Фотографии изделий"></div>

<button class="nav prev" id="prev" type="button" aria-label="Предыдущий кадр">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
</button>
<button class="nav next" id="next" type="button" aria-label="Следующий кадр">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
</button>

<div class="dots" id="dots"></div>

<script>
/* Порядок кадров: имена файлов в img/ */
const SHOTS = [
  "noir","smaragd","aquavela","rubis","amethyste","eclat","soleil",
  "rubelle","violetta","olivine","malachite","azur","lazuli",
  "safir","turmalin","topaz"
];

const rail=document.getElementById("rail");
const dots=document.getElementById("dots");
let index=0;

SHOTS.forEach((slug,i)=>{
  const fig=document.createElement("div");
  fig.className="slide";
  const img=document.createElement("img");
  img.src=`img/${slug}-look.webp`;
  img.alt="";
  img.decoding="async";
  img.loading=i<2?"eager":"lazy";
  img.addEventListener("click",()=>img.classList.toggle("zoom"));
  fig.append(img);
  rail.append(fig);

  const d=document.createElement("button");
  d.type="button";
  d.setAttribute("aria-label",`Кадр ${i+1} из ${SHOTS.length}`);
  d.setAttribute("aria-current",i===0?"true":"false");
  d.addEventListener("click",()=>go(i));
  dots.append(d);
});

const slides=[...rail.children];
const buttons=[...dots.children];

/* Кадры из общего хранилища — те же, что видны на сайте */
(async()=>{
  let shots=[];
  try{
    const r=await fetch("api/shots",{cache:"no-store"});
    if(!r.ok)return;
    shots=(await r.json()).shots||[];
  }catch(e){return}
  shots.forEach((sh,n)=>{
    const cell=document.createElement("div");
    cell.className="slide";
    const img=document.createElement("img");
    img.src=sh.url; img.alt=""; img.loading="lazy"; img.decoding="async";
    img.addEventListener("click",()=>img.classList.toggle("zoom"));
    cell.append(img);
    rail.append(cell);
    slides.push(cell);

    const d=document.createElement("button");
    d.type="button";
    d.setAttribute("aria-label",`Кадр ${SHOTS.length+n+1}`);
    d.setAttribute("aria-current","false");
    d.addEventListener("click",()=>go(SHOTS.length+n));
    dots.append(d);
    buttons.push(d);
  });
})();

document.getElementById("prev").addEventListener("click",()=>go(index-1));
document.getElementById("next").addEventListener("click",()=>go(index+1));
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key==="PageDown"){go(index+1);e.preventDefault()}
  if(e.key==="ArrowLeft"||e.key==="PageUp"){go(index-1);e.preventDefault()}
  if(e.key==="Home"){go(0);e.preventDefault()}
  if(e.key==="End"){go(slides.length-1);e.preventDefault()}
});

/* Колесо мыши листает по горизонтали */
rail.addEventListener("wheel",e=>{
  if(Math.abs(e.deltaY)<=Math.abs(e.deltaX))return;
  e.preventDefault();
  go(index+(e.deltaY>0?1:-1));
},{passive:false});
</script>
</body>
</html>
